###############################################################################
#  Reverse-proxy interne du client.
#
#  Pourquoi ? Odoo écoute sur DEUX ports :
#     8069 -> HTTP classique
#     8072 -> websocket / longpolling (obligatoire dès que workers > 0)
#  Traefik (Coolify/Dokploy) ne route qu'un seul port par domaine : ce nginx
#  fait l'aiguillage, gère le gzip, le cache des assets et la taille des uploads.
#
#  C'est le SEUL service exposé publiquement. Odoo et PostgreSQL restent
#  sur le réseau interne du projet.
#
#  POINT CRITIQUE — résolution DNS à l'exécution :
#  nginx résout les noms d'un bloc `upstream` UNE SEULE FOIS, au démarrage, et
#  garde l'adresse IP à vie. Dans Docker, le conteneur odoo change d'IP à chaque
#  recréation (redéploiement, redémarrage, mise à jour). nginx continue alors de
#  taper l'ancienne IP et renvoie :
#      connect() failed (113: Host is unreachable) ... upstream: "http://10.x.x.x:8069"
#      upstream server temporarily disabled
#  Et il ne s'en remet jamais tout seul : il faut redémarrer nginx.
#
#  La parade, appliquée ici : pas de bloc `upstream`, mais le résolveur DNS
#  interne de Docker (127.0.0.11) + un nom d'hôte stocké dans une VARIABLE.
#  La présence d'une variable dans proxy_pass force nginx à résoudre le nom à
#  CHAQUE requête, en respectant le TTL ci-dessous. Le proxy survit donc au
#  redémarrage d'Odoo sans intervention.
###############################################################################

#  127.0.0.11 = résolveur DNS embarqué de Docker (réseaux définis par
#  l'utilisateur et overlay Swarm). valid=10s : on retente la résolution toutes
#  les 10 s au plus. ipv6=off : évite les tentatives AAAA inutiles et lentes.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Traefik termine le TLS : on relaie le protocole d'origine à Odoo.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # Noms d'hôte en variables : résolution à l'exécution (voir en-tête).
    set $odoo_http "http://odoo:8069";
    set $odoo_ws   "http://odoo:8072";

    # --- Limites ------------------------------------------------------------
    client_max_body_size 512M;      # pièces jointes, imports, factures scannées
    client_body_buffer_size 128k;
    proxy_read_timeout  900s;
    proxy_connect_timeout 300s;
    proxy_send_timeout  900s;
    send_timeout        900s;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript application/x-javascript
               image/svg+xml application/wasm;

    # --- En-têtes de sécurité ----------------------------------------------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"      always;

    # --- En-têtes proxy communs --------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_redirect off;

    # --- Websocket / longpolling -------------------------------------------
    location /websocket {
        proxy_pass $odoo_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /longpolling {          # compatibilité Odoo <= 15
        proxy_pass $odoo_ws$request_uri;
    }

    # --- Assets statiques : cache navigateur --------------------------------
    location ~* /web/static/ {
        proxy_pass $odoo_http$request_uri;
        proxy_cache_valid 200 302 60m;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Sonde de santé -----------------------------------------------------
    #  Utilisée par le healthcheck du conteneur et par la supervision.
    #  Si Odoo est injoignable, on renvoie 502 : c'est le comportement voulu,
    #  le conteneur sera marqué unhealthy.
    location = /_health {
        access_log off;
        proxy_pass $odoo_http/web/health;
    }

    # --- Tout le reste ------------------------------------------------------
    location / {
        proxy_pass $odoo_http$request_uri;
    }
}
